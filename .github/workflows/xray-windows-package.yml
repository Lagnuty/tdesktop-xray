name: Xray Windows package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Empty means xray-v<app version>-run<run number>."
        required: false
        default: ""
      prerelease:
        description: "Publish as prerelease."
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'xray-v*'

concurrency:
  group: xray-windows-package
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 Xray package
    runs-on: windows-2022

    env:
      CACHE_COMPAT: cppwinrt-2503031
      PREPARE_PATH: Telegram/build/prepare/prepare.py
      TBUILD: ${{ github.workspace }}\TBuild
      LibrariesPath: ${{ github.workspace }}\TBuild\Libraries\win64

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild\${{ github.event.repository.name }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$GITHUB_WORKSPACE/TBuild/$REPO_NAME/docs/building-win.md"
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum "$GITHUB_WORKSPACE/TBuild/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: C++ WinRT headers.
        shell: pwsh
        run: |
          $version = '2.0.250303.1'
          $packages = Join-Path $env:TBUILD 'ThirdParty\NuGet'
          $package = Join-Path $packages "Microsoft.Windows.CppWinRT.$version"
          $nupkg = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.CppWinRT.$version.zip"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.Windows.CppWinRT/$version" `
            -OutFile $nupkg
          Expand-Archive -LiteralPath $nupkg -DestinationPath $package -Force
          $cppwinrt = Join-Path $package 'bin\cppwinrt.exe'
          if (-not (Test-Path $cppwinrt -PathType Leaf)) {
            throw "cppwinrt.exe was not found: $cppwinrt"
          }
          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          $metadata = Join-Path $env:WindowsSdkDir "UnionMetadata\$sdkVersion\Windows.winmd"
          if (-not (Test-Path $metadata -PathType Leaf)) {
            $metadata = Get-ChildItem `
              -LiteralPath (Join-Path $env:WindowsSdkDir 'UnionMetadata') `
              -Recurse `
              -Filter Windows.winmd |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $metadata -or -not (Test-Path $metadata -PathType Leaf)) {
            throw "Windows.winmd was not found in Windows SDK: $env:WindowsSdkDir"
          }
          $include = Join-Path $package 'generated'
          & $cppwinrt -input $metadata -output $include
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $include 'winrt\base.h') -PathType Leaf)) {
            throw "C++/WinRT include path was not found: $include"
          }
          "CPPWINRT_INCLUDE=$include" >> $env:GITHUB_ENV
          "INCLUDE=$include;$env:INCLUDE" >> $env:GITHUB_ENV
          "EXTERNAL_INCLUDE=$include;$env:EXTERNAL_INCLUDE" >> $env:GITHUB_ENV

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_COMPAT }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_COMPAT }}-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_COMPAT }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_COMPAT }}-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_COMPAT }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_COMPAT }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Free runner disk space.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          $paths = @(
            "${env:ProgramFiles}\dotnet",
            "${env:ProgramFiles(x86)}\Microsoft SDKs",
            "${env:ProgramFiles(x86)}\Android",
            "${env:ProgramFiles}\Android",
            "${env:ProgramFiles}\LLVM",
            "${env:ProgramFiles}\Microsoft SQL Server",
            "${env:ProgramFiles}\Git\mingw64\share\doc",
            "${env:LOCALAPPDATA}\NuGet\Cache",
            "${env:USERPROFILE}\.cargo",
            "${env:USERPROFILE}\.rustup",
            "${env:USERPROFILE}\.ghcup",
            "${env:USERPROFILE}\.gradle",
            "${env:USERPROFILE}\AppData\Local\Temp"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Build Telegram Desktop.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          cmake --build ..\out --config Debug --parallel 2 --target Telegram

      - name: Download Xray.
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/XTLS/Xray-core/releases/latest
          $asset = $release.assets | Where-Object { $_.name -eq 'Xray-windows-64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Xray-windows-64.zip was not found in the latest Xray release.' }
          $zip = Join-Path $env:RUNNER_TEMP 'xray.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP\xray
          Copy-Item -LiteralPath $env:RUNNER_TEMP\xray\xray.exe -Destination $env:TBUILD\$env:REPO_NAME\out\Debug\xray.exe

      - name: Install Inno Setup.
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package installer and portable zip.
        shell: pwsh
        run: |
          cd $env:TBUILD\$env:REPO_NAME
          Telegram\build\package_xray_win.ps1 `
            -ReleasePath out\Debug `
            -BuildTarget win64

      - name: Upload Xray package.
        uses: actions/upload-artifact@v7
        with:
          name: Telegram Xray Windows x64 package
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Debug\xray-package\

      - name: Resolve release tag.
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
            } else {
              $versionLine = Get-Content "$env:TBUILD\$env:REPO_NAME\Telegram\build\version" |
                Where-Object { $_ -match '^AppVersionStr\s+' } |
                Select-Object -First 1
              $version = ($versionLine -split '\s+')[1]
              $tag = "xray-v$version-run$env:GITHUB_RUN_NUMBER"
            }
          }
          $prerelease = if ($env:GITHUB_REF_TYPE -eq 'tag') { 'false' } else { '${{ github.event.inputs.prerelease }}' }
          "XRAY_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "XRAY_RELEASE_NAME=Telegram Xray $tag" >> $env:GITHUB_ENV
          "XRAY_PRERELEASE=$prerelease" >> $env:GITHUB_ENV

      - name: Publish GitHub release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.XRAY_RELEASE_TAG }}
          name: ${{ env.XRAY_RELEASE_NAME }}
          prerelease: ${{ env.XRAY_PRERELEASE }}
          body: |
            Telegram Desktop Xray build.

            Assets include Telegram Desktop, Updater.exe, and xray.exe.
            Use the installer for a normal install or the portable zip for a separate portable copy.
          files: |
            ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Debug\xray-package\*.zip
            ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out\Debug\xray-package\*.exe
