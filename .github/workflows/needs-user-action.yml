name: Needs user action.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  needs-user-action:
    runs-on: ubuntu-slim
    steps:
      - uses: lee-dohm/no-response@v0.5.0
        with:
          token: ${{ github.token }}
          responseRequiredLabel: needs user action
